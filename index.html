    </div>
    <div class="form-group" style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:0">
      <div><label style="margin-bottom:2px">Notifiche del browser</label><div class="hint">Avviso quando il recupero finisce</div></div>
      <button class="btn ${s.notificationsEnabled?'btn-primary':'btn-secondary'}" id="s-toggleNotif">${s.notificationsEnabled?'Attive':'Attiva'}</button>
    </div>
  </div>
  <div class="settings-block">
    <h3>Progressione onda</h3>
    <div class="form-group">
      <label>Incremento per nuovo ciclo (%)</label>
      <input class="input num" type="number" step="0.5" id="s-waveInc" value="${s.waveCycleIncrementPct}">
    </div>
    <div class="row">
      <div class="form-group"><label>Soglia "hold" (fall.)</label><input class="input num" type="number" min="1" step="1" id="s-cycleHold" value="${s.cycleHoldThreshold}"></div>
      <div class="form-group"><label>Soglia "reset" (fall.)</label><input class="input num" type="number" min="1" step="1" id="s-cycleReset" value="${s.cycleResetThreshold}"></div>
    </div>
    <div class="form-group" style="margin-bottom:0">
      <label>Mini-reset onda (%)</label>
      <input class="input num" type="number" step="0.5" id="s-cycleResetPct" value="${s.cycleResetPct}">
    </div>
  </div>
  <div class="settings-block">
    <h3>Deload onda</h3>
    <div class="form-group">
      <label>Frequenza (ogni N cicli)</label>
      <input class="input num" type="number" min="0" step="1" id="s-deloadEvery" value="${s.deloadEveryNCycles}">
      <div class="hint">0 = disabilitato.</div>
    </div>
    <div class="row-3">
      <div class="form-group"><label>Carico (%)</label><input class="input num" type="number" min="50" max="100" step="5" id="s-deloadLoad" value="${s.deloadLoadPct}"></div>
      <div class="form-group"><label>Set ×</label><input class="input num" type="number" min="0.1" max="1" step="0.1" id="s-deloadSets" value="${s.deloadSetsMult}"></div>
      <div class="form-group"><label>Reps ×</label><input class="input num" type="number" min="0.1" max="1" step="0.1" id="s-deloadReps" value="${s.deloadRepsMult}"></div>
    </div>
  </div>
  <div class="settings-block">
    <h3>Progressione lineare</h3>
    <div class="form-group"><label>Incremento (kg)</label><input class="input num" type="number" step="0.25" id="s-linInc" value="${s.linearIncrementKg}"></div>
    <div class="form-group" style="margin-bottom:0"><label>Deload a 2 fallimenti (%)</label><input class="input num" type="number" step="1" id="s-linReset" value="${s.linearResetPct}"></div>
  </div>
  <div class="settings-block">
    <h3>Generali</h3>
    <div class="form-group" style="margin-bottom:0"><label>Arrotondamento carico (kg)</label><input class="input num" type="number" step="0.25" id="s-plate" value="${s.plateRounding}"><div class="hint">2.5 dischi 1.25/lato, 1 manubri.</div></div>
  </div>
  <div class="settings-block">
    <h3>Dati</h3>
    <div class="row-actions">
      <button class="btn btn-secondary btn-block" id="s-export">Esporta JSON</button>
      <button class="btn btn-danger btn-block" id="s-wipe">Cancella tutto</button>
    </div>
  </div>
  <button class="btn btn-primary btn-block btn-lg" id="s-save" style="margin-top:18px">Salva impostazioni</button>`;
}

/* -------- REST TIMER -------- */
function renderRestTimerHtml() {
  const t = state.timer, r = 26, circ = 2*Math.PI*r;
  const remaining = Math.max(0, (t.endTs - Date.now())/1000);
  return `<div class="rest-timer">
    <div><div class="lbl">Recupero</div><div class="countdown ${remaining<=10?'warn':''}">${fmtSec(remaining)}</div></div>
    <div class="ring"><svg width="56" height="56"><circle class="bg" cx="28" cy="28" r="${r}"></circle><circle class="fg" cx="28" cy="28" r="${r}" stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-remaining/t.totalSec)}"></circle></svg></div>
    <button class="skip" data-skip-timer>Salta</button>
  </div>`;
}

/* -------- MODAL -------- */
function renderModal() {
  const m = state.ui.modal;
  if (!m) return '';
  if (m.type === 'cycle-results-info') return renderCycleResultsModal(m);
  return '';
}

function renderCycleResultsModal(m) {
  let title = 'Progressione <em>applicata</em>';
  let sections = '';
  for (const r of m.results) {
    const ex = findEx(r.exerciseId);
    const name = ex?.name || 'Esercizio';
    const info = r.info;
    if (info.kind === 'wave-cycle-end') {
      const kindLabel = {
        normal: { sectionClass: 'ok', text: `Avanzamento standard, base +${state.settings.waveCycleIncrementPct}%` },
        hold:   { sectionClass: 'warn', text: `Hold: base invariata (${info.fails} settimane fallite)` },
        reset:  { sectionClass: 'alert', text: `Mini-reset −${state.settings.cycleResetPct}% (${info.fails} settimane fallite)` },
      }[info.adjustmentKind];
      sections += `<div class="modal-section ${kindLabel.sectionClass}">
        <div class="lbl">${escapeHtml(name)} · ciclo ${info.completedCycle} concluso</div>
        <div class="val"><span>${fmtKg(info.oldBase)} ${state.settings.weightUnit}</span><span class="arrow">→</span><span class="big">${fmtKg(info.newBase)} ${state.settings.weightUnit}</span></div>
        <div class="note">${kindLabel.text}${info.pendingDeload?' · prossima sessione: deload programmato':''}</div>
      </div>`;
    } else if (info.kind === 'deload-completed') {
      sections += `<div class="modal-section ok">
        <div class="lbl">${escapeHtml(name)} · deload completato</div>
        <div class="note">Prossima sessione: ciclo regolare, settimana 1.</div>
      </div>`;
    } else if (info.kind === 'linear-deload') {
      sections += `<div class="modal-section alert">
        <div class="lbl">${escapeHtml(name)} · deload automatico</div>
        <div class="val"><span class="big">${fmtKg(info.newLoad)} ${state.settings.weightUnit}</span></div>
        <div class="note">Due fallimenti consecutivi: carico ridotto del ${state.settings.linearResetPct}%.</div>
      </div>`;
    }
  }
  if (!sections) sections = `<div class="modal-section ok"><div class="note">Seduta salvata. Tutti gli esercizi procedono secondo schema.</div></div>`;
  return `<div class="modal-backdrop"><div class="modal">
    <div class="grab"></div>
    <h2 class="modal-title">${title}</h2>
    ${sections}
    <div class="modal-actions"><button class="btn btn-primary btn-lg" data-modal-action="dismiss">Ok</button></div>
  </div></div>`;
}

/* -------- TOAST -------- */
let toastTimer = null;
function toast(msg) {
  const old = document.querySelector('.toast'); if (old) old.remove();
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 2200);
}

/* -------- HANDLERS -------- */
function attachHandlers() {
  // Tabs
  app.querySelectorAll('[data-tab]').forEach(el => el.addEventListener('click', () => {
    state.ui.tab = el.dataset.tab;
    state.ui.activeSchedaId = null;
    state.ui.activeDayId = null;
    state.ui.activeWorkoutId = null;
    if (state.ui.tab === 'allenamento') state.ui.view = 'home';
    else if (state.ui.tab === 'esercizi') state.ui.view = 'exercises-list';
    else if (state.ui.tab === 'storico') state.ui.view = 'history';
    else if (state.ui.tab === 'impostazioni') state.ui.view = 'settings';
    render();
  }));

  // Back buttons
  const backHome = app.querySelector('[data-back-home]');
  if (backHome) backHome.addEventListener('click', () => { state.ui.view='home'; state.ui.activeSchedaId=null; state.ui.activeDayId=null; render(); });
  const backDay = app.querySelector('[data-back-day]');
  if (backDay) backDay.addEventListener('click', () => { state.ui.view='day-detail'; render(); });
  const backHistory = app.querySelector('[data-back-history]');
  if (backHistory) backHistory.addEventListener('click', () => { state.ui.view='history'; state.ui.activeWorkoutId=null; render(); });
  const backExercises = app.querySelector('[data-back-exercises]');
  if (backExercises) backExercises.addEventListener('click', () => { state.ui.view='exercises-list'; render(); });

  // SCHEDE CRUD
  app.querySelectorAll('[data-add-scheda]').forEach(el => el.addEventListener('click', async () => {
    const name = prompt('Nome della nuova scheda:', '');
    if (!name || !name.trim()) return;
    state.schede.push({ id: uid('s'), name: name.trim(), createdAt: new Date().toISOString(), days: [] });
    await saveState(); render(); toast('Scheda creata');
  }));
  app.querySelectorAll('[data-edit-scheda]').forEach(el => el.addEventListener('click', () => {
    state.ui.activeSchedaId = el.dataset.editScheda;
    state.ui.view = 'scheda-detail';
    render();
  }));
  app.querySelectorAll('[data-rename-scheda]').forEach(el => el.addEventListener('click', async () => {
    const s = findScheda(el.dataset.renameScheda); if (!s) return;
    const n = prompt('Rinomina scheda:', s.name);
    if (!n || !n.trim()) return;
    s.name = n.trim(); await saveState(); render();
  }));
  app.querySelectorAll('[data-delete-scheda]').forEach(el => el.addEventListener('click', async () => {
    if (!confirm('Eliminare la scheda? Lo storico delle sedute resterà visibile.')) return;
    state.schede = state.schede.filter(s => s.id !== el.dataset.deleteScheda);
    state.ui.view = 'home'; state.ui.activeSchedaId = null;
    await saveState(); render(); toast('Scheda eliminata');
  }));

  // DAYS CRUD
  app.querySelectorAll('[data-add-day]').forEach(el => el.addEventListener('click', async () => {
    const s = findScheda(el.dataset.addDay); if (!s) return;
    const defaultName = `Giorno ${s.days.length+1}`;
    const name = prompt('Nome del giorno:', defaultName);
    if (!name || !name.trim()) return;
    s.days.push({ id: uid('d'), name: name.trim(), exerciseIds: [] });
    await saveState(); render(); toast('Giorno aggiunto');
  }));
  app.querySelectorAll('[data-open-day]').forEach(el => el.addEventListener('click', (ev) => {
    if (ev.target.closest('[data-rename-day]') || ev.target.closest('[data-remove-ex-from-day]')) return;
    const [sid, did] = el.dataset.openDay.split('|');
    state.ui.activeSchedaId = sid; state.ui.activeDayId = did;
    state.ui.view = 'day-detail';
    render();
  }));
  app.querySelectorAll('[data-rename-day]').forEach(el => el.addEventListener('click', async (ev) => {
    ev.stopPropagation();
    const [sid, did] = el.dataset.renameDay.split('|');
    const d = findDay(sid, did); if (!d) return;
    const n = prompt('Rinomina giorno:', d.name);
    if (!n || !n.trim()) return;
    d.name = n.trim(); await saveState(); render();
  }));
  app.querySelectorAll('[data-delete-day]').forEach(el => el.addEventListener('click', async () => {
    if (!confirm('Eliminare questo giorno? Lo storico resta intatto.')) return;
    const [sid, did] = el.dataset.deleteDay.split('|');
    const s = findScheda(sid); if (!s) return;
    s.days = s.days.filter(d => d.id !== did);
    state.ui.view = 'scheda-detail';
    state.ui.activeDayId = null;
    await saveState(); render(); toast('Giorno eliminato');
  }));

  // ADD EXERCISE TO DAY (open picker)
  app.querySelectorAll('[data-add-ex-to-day]').forEach(el => el.addEventListener('click', () => {
    const [sid, did] = el.dataset.addExToDay.split('|');
    state.ui.activeSchedaId = sid;
    state.ui.activeDayId = did;
    state.ui.pickerTargetDayId = did;
    state.ui.view = 'exercise-picker';
    render();
  }));
  app.querySelectorAll('[data-pick-ex]').forEach(el => el.addEventListener('click', async () => {
    const d = findDay(state.ui.activeSchedaId, state.ui.pickerTargetDayId); if (!d) return;
    const exId = el.dataset.pickEx;
    if (!d.exerciseIds.includes(exId)) d.exerciseIds.push(exId);
    state.ui.view = 'day-detail';
    state.ui.pickerTargetDayId = null;
    await saveState(); render(); toast('Esercizio aggiunto');
  }));
  app.querySelectorAll('[data-remove-ex-from-day]').forEach(el => el.addEventListener('click', async (ev) => {
    ev.stopPropagation();
    const [sid, did, exId] = el.dataset.removeExFromDay.split('|');
    const d = findDay(sid, did); if (!d) return;
    d.exerciseIds = d.exerciseIds.filter(id => id !== exId);
    await saveState(); render(); toast('Rimosso dal giorno');
  }));
  const gotoNewEx = app.querySelector('[data-goto-new-ex]');
  if (gotoNewEx) gotoNewEx.addEventListener('click', () => {
    state.ui.tab = 'esercizi';
    state.ui.view = 'exercise-form';
    state.ui.editingExId = null;
    window._exDraft = null;
    render();
  });

  // START DAY (begin workout)
  app.querySelectorAll('[data-start-day]').forEach(el => el.addEventListener('click', () => {
    const [sid, did] = el.dataset.startDay.split('|');
    const d = findDay(sid, did); if (!d || d.exerciseIds.length === 0) return;
    const exercises = d.exerciseIds.map(exId => {
      const ex = findEx(exId);
      if (!ex) return null;
      const p = nextPrescription(ex);
      return {
        exerciseId: exId,
        prescribed: p,
        sets: Array.from({length: p.sets}, () => ({ reps: p.reps, load: p.load, status: null })),
        userAction: null,
      };
    }).filter(x => x);
    if (exercises.length === 0) { toast('Nessun esercizio valido'); return; }
    state.ui.workoutDraft = { schedaId: sid, dayId: did, date: new Date().toISOString(), currentExIdx: 0, exercises };
    state.ui.summaryChoices = {};
    state.ui.view = 'workout';
    render();
  }));

  // EXERCISE LIST / FORM
  app.querySelectorAll('[data-add-ex]').forEach(el => el.addEventListener('click', () => {
    state.ui.editingExId = null; state.ui.view = 'exercise-form'; window._exDraft = null;
    render();
  }));
  app.querySelectorAll('[data-edit-ex]').forEach(el => el.addEventListener('click', () => {
    state.ui.editingExId = el.dataset.editEx; state.ui.view = 'exercise-form'; window._exDraft = null;
    render();
  }));
  app.querySelectorAll('[data-scheme]').forEach(el => el.addEventListener('click', () => {
    captureFormDraft(); window._exDraft.scheme = el.dataset.scheme; render();
  }));
  const saveExBtn = app.querySelector('[data-save-ex]');
  if (saveExBtn) saveExBtn.addEventListener('click', async () => {
    captureFormDraft();
    const d = window._exDraft;
    if (!d.name?.trim()) { toast('Nome richiesto'); return; }
    const isEdit = !!state.ui.editingExId;
    const ex = isEdit ? findEx(state.ui.editingExId) : { id: uid('x'), createdAt: new Date().toISOString() };
    ex.name = d.name.trim();
    ex.scheme = d.scheme;
    ex.restSeconds = Math.max(0, Number(d.restSeconds) || 0);
    if (d.scheme === 'wave') {
      ex.waveBaseLoad = Number(d.waveBaseLoad) || 0;
      if (ex.waveCurrentWeek == null) ex.waveCurrentWeek = 1;
      if (ex.waveCurrentCycle == null) ex.waveCurrentCycle = 1;
      if (ex.cycleFailures == null) ex.cycleFailures = 0;
      if (ex.pendingDeload == null) ex.pendingDeload = false;
    } else {
      ex.linearCurrentLoad = Number(d.linearCurrentLoad) || 0;
      ex.linearTargetSets = Math.max(1, Number(d.linearTargetSets) || 5);
      ex.linearTargetReps = Math.max(1, Number(d.linearTargetReps) || 5);
      if (ex.linearConsecutiveFailures == null) ex.linearConsecutiveFailures = 0;
    }
    if (!isEdit) state.exercises.push(ex);
    window._exDraft = null;
    state.ui.editingExId = null;
    state.ui.view = 'exercises-list';
    await saveState(); render();
    toast(isEdit?'Esercizio aggiornato':'Esercizio aggiunto');
  });
  const cancelForm = app.querySelector('[data-cancel-form]');
  if (cancelForm) cancelForm.addEventListener('click', () => {
    window._exDraft = null;
    state.ui.editingExId = null;
    state.ui.view = 'exercises-list';
    render();
  });
  const delExBtn = app.querySelector('[data-delete-ex]');
  if (delExBtn) delExBtn.addEventListener('click', async () => {
    const exId = delExBtn.dataset.deleteEx;
    if (!confirm('Eliminare? Verrà rimosso anche dalle schede in cui è presente. Lo storico resta intatto.')) return;
    const ex = findEx(exId);
    state.workouts.forEach(w => w.exerciseEntries.forEach(e => { if (e.exerciseId === exId && !e.exerciseNameSnapshot) e.exerciseNameSnapshot = ex?.name; }));
    state.schede.forEach(s => s.days.forEach(d => { d.exerciseIds = d.exerciseIds.filter(id => id !== exId); }));
    state.exercises = state.exercises.filter(e => e.id !== exId);
    window._exDraft = null;
    state.ui.editingExId = null;
    state.ui.view = 'exercises-list';
    await saveState(); render();
  });
  const resetProgBtn = app.querySelector('[data-reset-prog]');
  if (resetProgBtn) resetProgBtn.addEventListener('click', async () => {
    const ex = findEx(state.ui.editingExId); if (!ex) return;
    if (ex.scheme === 'wave') {
      if (!confirm('Riportare l\'esercizio a Settimana 1 / Ciclo 1?')) return;
      ex.waveCurrentWeek = 1; ex.waveCurrentCycle = 1; ex.cycleFailures = 0; ex.pendingDeload = false;
    } else { ex.linearConsecutiveFailures = 0; }
    await saveState(); render(); toast('Stato azzerato');
  });
  ['#f-name','#f-restSeconds','#f-waveBaseLoad','#f-linearCurrentLoad','#f-linearTargetSets','#f-linearTargetReps'].forEach(sel => {
    const el = app.querySelector(sel); if (el) el.addEventListener('input', captureFormDraft);
  });

  // WORKOUT
  const quitWk = app.querySelector('[data-quit-wk]');
  if (quitWk) quitWk.addEventListener('click', () => {
    const draft = state.ui.workoutDraft;
    const anyLogged = draft && draft.exercises.some(e => e.sets.some(s => s.status !== null));
    if (anyLogged && !confirm('Uscire senza salvare? I dati loggati andranno persi.')) return;
    state.ui.workoutDraft = null;
    state.ui.summaryChoices = {};
    stopRestTimer();
    state.ui.view = 'home';
    render();
  });
  app.querySelectorAll('[data-set-reps]').forEach(el => el.addEventListener('change', () => {
    const i = +el.dataset.setReps;
    state.ui.workoutDraft.exercises[state.ui.workoutDraft.currentExIdx].sets[i].reps = +el.value || 0;
  }));
  app.querySelectorAll('[data-set-load]').forEach(el => el.addEventListener('change', () => {
    const i = +el.dataset.setLoad;
    state.ui.workoutDraft.exercises[state.ui.workoutDraft.currentExIdx].sets[i].load = +el.value || 0;
  }));
  app.querySelectorAll('[data-set-ok]').forEach(el => el.addEventListener('click', () => {
    const i = +el.dataset.setOk;
    captureSetInputs(i);
    const entry = state.ui.workoutDraft.exercises[state.ui.workoutDraft.currentExIdx];
    entry.sets[i].status = 'ok';
    const ex = findEx(entry.exerciseId);
    if (ex && ex.restSeconds > 0 && !entry.sets.every(s => s.status !== null)) startRestTimer(ex.restSeconds, ex.name);
    else render();
  }));
  app.querySelectorAll('[data-set-fail]').forEach(el => el.addEventListener('click', () => {
    const i = +el.dataset.setFail;
    captureSetInputs(i);
    state.ui.workoutDraft.exercises[state.ui.workoutDraft.currentExIdx].sets[i].status = 'fail';
    render();
  }));
  app.querySelectorAll('[data-set-undo]').forEach(el => el.addEventListener('click', () => {
    const i = +el.dataset.setUndo;
    state.ui.workoutDraft.exercises[state.ui.workoutDraft.currentExIdx].sets[i].status = null;
    render();
  }));
  const wkPrev = app.querySelector('[data-wk-prev]');
  if (wkPrev) wkPrev.addEventListener('click', () => {
    if (state.ui.workoutDraft.currentExIdx > 0) state.ui.workoutDraft.currentExIdx--;
    stopRestTimer();
    render();
  });
  const wkNext = app.querySelector('[data-wk-next]');
  if (wkNext) wkNext.addEventListener('click', () => {
    if (state.ui.workoutDraft.currentExIdx < state.ui.workoutDraft.exercises.length - 1) state.ui.workoutDraft.currentExIdx++;
    stopRestTimer();
    render();
  });
  const wkFinish = app.querySelector('[data-wk-finish]');
  if (wkFinish) wkFinish.addEventListener('click', () => {
    stopRestTimer();
    state.ui.view = 'workout-summary';
    render();
  });

  // SUMMARY
  app.querySelectorAll('[data-summary-choice]').forEach(el => el.addEventListener('click', () => {
    const [exId, action] = el.dataset.summaryChoice.split('|');
    state.ui.summaryChoices[exId] = action;
    render();
  }));
  const backToWk = app.querySelector('[data-wk-back-to-workout]');
  if (backToWk) backToWk.addEventListener('click', () => { state.ui.view = 'workout'; render(); });
  const commit = app.querySelector('[data-wk-commit]');
  if (commit) commit.addEventListener('click', async () => {
    await commitWorkout();
  });

  // HISTORY
  app.querySelectorAll('[data-open-workout]').forEach(el => el.addEventListener('click', () => {
    state.ui.activeWorkoutId = el.dataset.openWorkout;
    state.ui.view = 'workout-detail';
    render();
  }));

  // TIMER
  const skipBtn = app.querySelector('[data-skip-timer]');
  if (skipBtn) skipBtn.addEventListener('click', stopRestTimer);

  // MODAL
  app.querySelectorAll('[data-modal-action]').forEach(el => el.addEventListener('click', () => {
    state.ui.modal = null;
    render();
  }));

  // SETTINGS
  const sSave = app.querySelector('#s-save');
  if (sSave) sSave.addEventListener('click', async () => {
    const $ = sel => app.querySelector(sel);
    state.settings.defaultRestSec = Math.max(0, +$('#s-defaultRest').value || 0);
    state.settings.waveCycleIncrementPct = +$('#s-waveInc').value || 0;
    state.settings.linearIncrementKg = +$('#s-linInc').value || 0;
    state.settings.linearResetPct = +$('#s-linReset').value || 0;
    state.settings.plateRounding = +$('#s-plate').value || 2.5;
    state.settings.cycleHoldThreshold = Math.max(1, +$('#s-cycleHold').value || 2);
    state.settings.cycleResetThreshold = Math.max(state.settings.cycleHoldThreshold, +$('#s-cycleReset').value || 3);
    state.settings.cycleResetPct = Math.max(0, +$('#s-cycleResetPct').value || 5);
    state.settings.deloadEveryNCycles = Math.max(0, +$('#s-deloadEvery').value || 0);
    state.settings.deloadLoadPct = Math.min(100, Math.max(10, +$('#s-deloadLoad').value || 90));
    state.settings.deloadSetsMult = Math.min(1, Math.max(0.1, +$('#s-deloadSets').value || 0.5));
    state.settings.deloadRepsMult = Math.min(1, Math.max(0.1, +$('#s-deloadReps').value || 0.8));
    await saveState(); toast('Impostazioni salvate');
  });
  const sNotif = app.querySelector('#s-toggleNotif');
  if (sNotif) sNotif.addEventListener('click', async () => {
    if (!state.settings.notificationsEnabled) {
      if ('Notification' in window) {
        const perm = await Notification.requestPermission();
        if (perm === 'granted') state.settings.notificationsEnabled = true;
        else { toast('Permesso negato'); return; }
      } else { toast('Notifiche non supportate'); return; }
    } else state.settings.notificationsEnabled = false;
    await saveState(); render();
  });
  const sExport = app.querySelector('#s-export');
  if (sExport) sExport.addEventListener('click', () => {
    const payload = JSON.stringify({exercises:state.exercises,schede:state.schede,workouts:state.workouts,settings:state.settings}, null, 2);
    const blob = new Blob([payload], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `ghisa-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  });
  const sWipe = app.querySelector('#s-wipe');
  if (sWipe) sWipe.addEventListener('click', async () => {
    if (!confirm('Cancellare TUTTI i dati? Irreversibile.')) return;
    state.exercises = []; state.schede = []; state.workouts = [];
    state.settings = { ...DEFAULT_SETTINGS };
    try { await window.storage.delete(STORAGE_KEY); } catch {}
    state.ui.view = 'home'; state.ui.tab = 'allenamento';
    render(); toast('Dati cancellati');
  });
}

function captureSetInputs(i) {
  const entry = state.ui.workoutDraft.exercises[state.ui.workoutDraft.currentExIdx];
  const repsEl = app.querySelector(`[data-set-reps="${i}"]`);
  const loadEl = app.querySelector(`[data-set-load="${i}"]`);
  if (repsEl) entry.sets[i].reps = +repsEl.value || 0;
  if (loadEl) entry.sets[i].load = +loadEl.value || 0;
}

function captureFormDraft() {
  if (!window._exDraft) return;
  const $ = sel => app.querySelector(sel)?.value;
  const n = sel => { const v = $(sel); return v===undefined ? undefined : +v; };
  const d = window._exDraft;
  if ($('#f-name')!==undefined) d.name = $('#f-name');
  if (n('#f-restSeconds')!==undefined) d.restSeconds = n('#f-restSeconds');
  if (n('#f-waveBaseLoad')!==undefined) d.waveBaseLoad = n('#f-waveBaseLoad');
  if (n('#f-linearCurrentLoad')!==undefined) d.linearCurrentLoad = n('#f-linearCurrentLoad');
  if (n('#f-linearTargetSets')!==undefined) d.linearTargetSets = n('#f-linearTargetSets');
  if (n('#f-linearTargetReps')!==undefined) d.linearTargetReps = n('#f-linearTargetReps');
}

/* -------- COMMIT WORKOUT -------- */
async function commitWorkout() {
  const dr = state.ui.workoutDraft;
  if (!dr) return;
  const results = [];
  const exerciseEntries = [];
  for (const entry of dr.exercises) {
    const ex = findEx(entry.exerciseId);
    if (!ex) continue;
    const anyLogged = entry.sets.some(s => s.status !== null);
    const persisted = {
      exerciseId: entry.exerciseId,
      prescribed: entry.prescribed,
      actualSets: entry.sets.map(s => ({...s})),
      userAction: null,
      resultInfo: null,
      isDeloadSession: !!entry.prescribed.isDeload,
    };
    if (anyLogged) {
      const userAction = state.ui.summaryChoices[entry.exerciseId] || null;
      const info = applyEntryResult(ex, persisted, userAction);
      persisted.userAction = userAction;
      persisted.resultInfo = info;
      if (info.kind === 'wave-cycle-end' || info.kind === 'deload-completed' || info.kind === 'linear-deload') {
        results.push({ exerciseId: entry.exerciseId, info });
      }
    }
    exerciseEntries.push(persisted);
  }
  const workout = {
    id: uid('w'),
    schedaId: dr.schedaId,
    dayId: dr.dayId,
    date: dr.date,
    exerciseEntries,
  };
  state.workouts.push(workout);
  state.ui.workoutDraft = null;
  state.ui.summaryChoices = {};
  state.ui.view = 'home';
  state.ui.tab = 'allenamento';
  stopRestTimer();
  if (results.length > 0) state.ui.modal = { type: 'cycle-results-info', results };
  else toast('Seduta salvata');
  await saveState();
  render();
}

/* -------- INIT -------- */
(async () => {
  await loadState();
  render();
})();
</script>
